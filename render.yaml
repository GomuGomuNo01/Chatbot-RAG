# render.yaml — Déploiement Render.com
# Runtime : Python 3  (sélectionner "Python 3" dans Update Source > Runtime)
# Doc : https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: chatbot-rag
    runtime: python
    plan: free

    # ── Build ──────────────────────────────────────────────────────────────
    # requirements-prod.txt : exclut sentence-transformers/PyTorch (~2 GB)
    # Les embeddings utilisent l'API HuggingFace en production (HF_TOKEN).
    buildCommand: pip install -r requirements-prod.txt

    # ── Démarrage ─────────────────────────────────────────────────────────
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    # ── Health check ──────────────────────────────────────────────────────
    healthCheckPath: /api/health

    # ── Variables d'environnement ─────────────────────────────────────────
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # LLM Groq — OBLIGATOIRE
      - key: GROQ_API_KEY
        sync: false             # Renseigner dans : Dashboard > Environment

      # HuggingFace Hub — persistance de l'index FAISS entre redémarrages
      # Créer un dépôt privé de type "dataset" sur huggingface.co puis renseigner :
      - key: HF_TOKEN
        sync: false             # Token HF avec droits write
      - key: HF_REPO_ID
        sync: false             # ex: "monpseudo/chatbot-rag-index"

      # Cloudflare R2 — stockage des PDFs sources (optionnel)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

    # ── Disk persistant (plans payants) ───────────────────────────────────
    # Alternative à HF Hub pour stocker l'index FAISS directement sur Render.
    # disk:
    #   name: faiss-index
    #   mountPath: /app/data
    #   sizeGB: 1
