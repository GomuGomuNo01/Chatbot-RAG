name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "assets/video/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:   # déclenchement manuel possible

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble site (frontend + presentation page)
        run: |
          mkdir -p _site/presentation
          cp -r frontend/. _site/
          cp assets/video/index.html assets/video/DocAssist_presentation.mp4 assets/video/presentation-poster.jpg _site/presentation/

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
