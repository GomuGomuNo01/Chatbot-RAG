name: CI — Tests & Qualité

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "api/**"
      - "tests/**"
      - "config.py"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1 : Tests unitaires + couverture
  # ────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests
        run: |
          pytest \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -q
        env:
          # Variables factices pour que config.py ne lève pas d'erreur
          ANTHROPIC_API_KEY: "sk-ant-test-dummy"
          HF_TOKEN: ""
          R2_ACCOUNT_ID: ""
          R2_ACCESS_KEY_ID: ""
          R2_SECRET_ACCESS_KEY: ""
          R2_BUCKET_NAME: ""

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Job 2 : Lint & formatage (ruff)
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check . --output-format=github

      - name: Format check
        run: ruff format . --check

  # ────────────────────────────────────────────────────────────
  # Job 3 : Vérification de sécurité (pip-audit)
  # ────────────────────────────────────────────────────────────
  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-jfh8-c2jp-hdmh
        continue-on-error: true   # non bloquant — audit informatif
