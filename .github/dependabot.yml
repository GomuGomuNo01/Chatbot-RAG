version: 2

updates:
  # ── Dépendances Python (pip) ───────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      langchain:
        patterns:
          - "langchain*"
      testing:
        patterns:
          - "pytest*"
          - "httpx"
    ignore:
      # langchain-huggingface (1.2.3 incluse) exige huggingface-hub < 2.0.0 :
      # retirer cette règle quand une version compatible avec la 2.x sortira.
      - dependency-name: "huggingface_hub"
        versions: [">=2.0.0"]

  # ── Actions GitHub ─────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
